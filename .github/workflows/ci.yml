name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependencias
        run: dotnet restore SistemaAcademico.slnx
      - name: Compilar
        run: dotnet build SistemaAcademico.slnx --no-restore -c Release
      - name: Pruebas (unitarias + integración con SQLite en memoria)
        run: dotnet test SistemaAcademico.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: cp .env.example .env && docker compose config --quiet
